name: 🖥️ RDP Connection Test

on:
  workflow_dispatch:

jobs:
  check-rdp:
    runs-on: windows-latest
    steps:
      - name: 📡 Display Tailscale IP
        run: |
          Write-Host "🔌 Tailscale IP Detected: 100.84.49.76"

      - name: 🧪 Test RDP Connectivity (Port 3389)
        run: |
          Write-Host "🔎 Testing connectivity to 100.84.49.76:3389..."
          $testResult = Test-NetConnection -ComputerName "100.84.49.76" -Port 3389
          
          if (-not $testResult.TcpTestSucceeded) {
              Write-Host "❌ TCP connection to RDP port 3389 failed!"
              Write-Host "⚠️ Possible reasons:"
              Write-Host "   - RDP service is not running on target machine"
              Write-Host "   - Port 3389 is blocked by firewall"
              Write-Host "   - GitHub runner cannot reach private Tailscale IP"
              exit 1
          }

          Write-Host "✅ TCP connectivity successful! RDP port is reachable."

      - name: 🖥️ Maintain RDP Session
        run: |
          Write-Host ""
          Write-Host "=============================="
          Write-Host "       🔐 RDP ACCESS INFO      "
          Write-Host "=============================="
          Write-Host "📍 Address : 100.84.49.76"
          Write-Host "👤 Username: RDP"
          Write-Host "🔑 Password: mc6qrtvstw83;+%F?"
          Write-Host "=============================="
          Write-Host ""
          Write-Host "💡 Tip: Use 'mstsc' in Windows or any RDP client to connect."
          Write-Host ""

          # Keep GitHub Actions runner alive for ~24 hours
          while ($true) {
              Write-Host "[$(Get-Date)] 🟢 RDP Active - Press Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
